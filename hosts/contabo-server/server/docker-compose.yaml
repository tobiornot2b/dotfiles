services:
  traefik:
    image: traefik:3.7.10

    environment:
      DOCKER_API_VERSION: "1.47"

    command:
      - --api.dashboard=false
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=apps-backend

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/apps/letsencrypt:/letsencrypt

    networks:
      - web
      - backend

    restart: unless-stopped

  vikunja:
    image: vikunja/vikunja:2.5.0

    environment:
      VIKUNJA_SERVICE_PUBLICURL: https://todo.tobiornot2b.com/

      VIKUNJA_DATABASE_HOST: postgres
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_USER: ${POSTGRES_USER}
      VIKUNJA_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      VIKUNJA_DATABASE_DATABASE: ${VIKUNJA_DATABASE_NAME}

      VIKUNJA_SERVICE_JWTSECRET: ${VIKUNJA_SERVICE_JWTSECRET}

    volumes:
      - /var/lib/apps/vikunja/files:/app/vikunja/files

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    labels:
      - traefik.enable=true
      - traefik.docker.network=apps-backend

      - traefik.http.routers.vikunja.rule=Host(`todo.tobiornot2b.com`)
      - traefik.http.routers.vikunja.entrypoints=websecure
      - traefik.http.routers.vikunja.tls=true
      - traefik.http.routers.vikunja.tls.certresolver=letsencrypt

      - traefik.http.services.vikunja.loadbalancer.server.port=3456

    restart: unless-stopped

  postgres:
    image: postgres:18.4

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: -c shared_buffers=256MB -c max_connections=200

    volumes:
      - /var/lib/apps/postgres/data:/var/lib/postgresql

    networks:
      - backend

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

networks:
  web:
    name: apps-web

  backend:
    name: apps-backend
    internal: true
